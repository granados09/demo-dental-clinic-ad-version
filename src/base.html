/* ================= VENTAS Y UTILIDAD ================= */
function vVentas(){
  const [from, to, label] = RANGES[state.salesRange]();
  const pays = salesIn(from, to, state.sede);
  const P = profitOf(pays, from, to, state.sede);
  const days = dayDiff(to, from) + 1;
  const pf = addDays(from, -days), pt = addDays(to, -days);
  const prevP = profitOf(salesIn(pf, pt, state.sede), pf, pt, state.sede);
  const cmp = state.salesRange==='hoy' ? 'vs. el mismo día de la semana pasada' : 'vs. el periodo anterior';
  const prevDay = state.salesRange==='hoy' ? profitOf(salesIn(addDays(TODAY,-7), addDays(TODAY,-7), state.sede).filter(p=>p.time<=NOW_MIN), TODAY, TODAY, state.sede) : prevP;
  const margin = P.ventas ? P.net/P.ventas*100 : 0;
  // gráfica diaria
  const chartDays = state.salesRange==='mes' ? Math.max(7, TODAY.getDate()) : state.salesRange==='anterior' ? new Date(PREV_Y,PREV_M+1,0).getDate() : 14;
  const end = state.salesRange==='anterior' ? new Date(PREV_Y,PREV_M+1,0) : TODAY;
  const groups = [];
  for(let i=chartDays-1;i>=0;i--){ const d = addDays(end,-i); const pp = profitOf(salesIn(d,d,state.sede), d, d, state.sede); groups.push({label: chartDays>16 ? String(d.getDate()) : fDay(d), a:Math.round(pp.ventas), b:Math.max(0,Math.round(pp.net))}); }
  // por tratamiento
  const byS = {}; pays.forEach(p=>{ const k = p.s || 'otros'; const x = byS[k] = byS[k] || {n:0, v:0, c:0}; x.n++; x.v += p.amount; x.c += payHon(p) + payCost(p); });
  const rowsS = Object.entries(byS).sort((a,b)=>b[1].v-a[1].v).slice(0,8).map(([k,x])=>`<tr><td><b style="font-weight:600">${k==='otros'?'Abonos a planes':esc(SERV[k].name)}</b></td><td class="num">${x.n}</td><td class="num">${Q(x.v)}</td><td class="num muted">${Q(x.c)}</td><td class="num"><b>${Q(x.v-x.c)}</b></td><td class="num">${x.v?Math.round((x.v-x.c)/x.v*100):0}%</td></tr>`).join('');
  const byD = DOCTORS.filter(d=>inSede(d)).map(d=>{ const ps = pays.filter(p=>p.doc===d.id); return {label:d.short, sub:d.spec, value:sum(ps,p=>p.amount)}; }).sort((a,b)=>b.value-a.value);
  const byM = ['Tarjeta','Efectivo','Transferencia'].map((m,i)=>({label:m, value:sum(pays.filter(p=>p.method===m),p=>p.amount), fmt:Q, color:['#13285E','#3D63C4','#8FB0F5'][i]}));
  const wf = (l, v, cls) => `<div class="wf ${cls||''}"><span>${l}</span><b class="tnum">${Q(v)}</b></div>`;
  return pageHead('Ventas y utilidad', 'Cuánto vendiste y cuánto ganaste. La utilidad ya descuenta honorarios, insumos, laboratorio y los gastos fijos del periodo.', btn('Exportar','toast-excel','btn-glass','download')) +
    tabs([['hoy','Hoy'],['semana','Esta semana'],['mes','Este mes'],['anterior',fMonth(PREV_Y,PREV_M)]], state.salesRange, 'sales-range') +
    `<div class="grid g4">${kpi('Vendido '+label.toLowerCase(), Q(P.ventas), trend(P.ventas, prevDay.ventas, cmp), 'wallet')}${kpi('Utilidad estimada', Q(P.net), `Margen de ${margin.toFixed(1)}%`, 'trend')}${kpi('Ventas', NF0.format(P.n), `Ticket promedio ${Q(P.n?P.ventas/P.n:0)}`, 'receipt')}${kpi('IVA incluido en ventas', Q(P.iva), 'Se declara en Impuestos', 'percent')}</div>
    <div class="grid g-main mt"><div class="card glass"><div class="card-head"><div><h3>Vendido y utilidad por día</h3><p>${state.salesRange==='mes'||state.salesRange==='anterior'?'Cada barra es un día del mes':'Últimos 14 días'}</p></div><div class="legend"><span><i style="background:var(--bar-a)"></i>Vendido</span><span><i style="background:#1FA774"></i>Utilidad</span></div></div>${groupBars(groups,{label:'Vendido y utilidad por día', bClass:'bar-g', aLabel:'vendido', bLabel:'utilidad'})}</div>
    <div class="card glass"><div class="card-head"><div><h3>Cómo se calcula</h3><p>${esc(label)}${state.sede!=='all'?', '+esc(sedeName(state.sede)):''}</p></div></div><div class="wfall">${wf('Vendido', P.ventas)}${wf('Honorarios de doctores', P.hon, 'minus', true)}${wf('Insumos y laboratorio', P.cost, 'minus', true)}${wf('Utilidad bruta', P.gross, 'sub')}${wf('Alquiler, planilla y servicios del periodo', P.fixed, 'minus', true)}${wf('Utilidad estimada', P.net, 'total')}</div></div></div>
    <div class="grid g2 mt"><div class="card glass span2"><div class="card-head"><div><h3>Por tratamiento</h3><p>Qué deja más dinero</p></div></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tratamiento</th><th class="num">Ventas</th><th class="num">Vendido</th><th class="num">Costo directo</th><th class="num">Utilidad</th><th class="num">Margen</th></tr></thead><tbody>${rowsS||'<tr><td colspan="6" class="muted">Sin ventas en este periodo</td></tr>'}</tbody></table></div></div>
    <div class="card glass"><div class="card-head"><div><h3>Por doctor</h3><p>Producción del periodo</p></div></div>${hbars(byD, Q)}</div>
    <div class="card glass"><div class="card-head"><div><h3>Cómo pagaron</h3><p>Método de pago</p></div></div>${donut(byM, kQ(P.ventas), 'vendido')}</div></div>`;
}

/* ================= IMPUESTOS ================= */
function vImpuestos(){
  const hist = taxMonthsHist(); const prev = hist[hist.length-2], cur = hist[hist.length-1];
  const r = state.regime; const pm = fMonth(prev.y,prev.m).toLowerCase(), cm = fMonth(cur.y,cur.m).toLowerCase();
  const isr = t => r==='opcional' ? t.isrOpc : r==='utilidades' ? t.isrUtil : 0;
  const due = t => r==='pequeno' ? t.peq : t.iva;
  let k = '';
  if(r==='pequeno'){
    k += kpi(`Impuesto de ${pm}`, Q(prev.peq), '5% sobre lo vendido', 'percent') + kpi(`Vendido en ${pm}`, Q(prev.ventas), 'Ingresos del mes', 'wallet') + kpi(`Así va ${cm}`, Q(cur.peq), 'Estimado con lo vendido hasta hoy', 'trend') + kpi('Pagado este año', Q(sum(hist.filter(h=>h.status==='pagado'),h=>h.peq)), 'Meses ya pagados', 'check');
  } else {
    k += kpi(`IVA de ${pm} por pagar`, Q(prev.iva), `IVA cobrado menos IVA de compras`, 'percent') + kpi('IVA cobrado en ventas', Q(prev.deb), `Débito fiscal de ${pm}`, 'upright') + kpi('IVA de tus compras', Q(prev.cred), `Crédito fiscal de ${pm}`, 'downright') + kpi(`ISR de ${pm}`, Q(isr(prev)), r==='opcional'?'5% hasta Q30,000 y 7% sobre el excedente':'Estimado al 25% de la utilidad', 'bank');
  }
  const rows = hist.slice().reverse().map(t=>{
    const st = t.status==='pagado' ? pill('Pagado el '+fDay(t.paidOn),'p-green') : t.status==='presentar' ? pill('Por presentar','p-amber') : pill('En curso','p-gray');
    return r==='pequeno' ? `<tr><td><b>${fMonth(t.y,t.m)}</b></td><td class="num">${Q(t.ventas)}</td><td class="num"><b>${Q(t.peq)}</b></td><td>${st}</td></tr>`

let SIG = {drawn:false};
function initSig(){
  const cv = $('#sig'); if(!cv) return; const r = cv.getBoundingClientRect(); const dpr = window.devicePixelRatio||1;
  cv.width = r.width*dpr; cv.height = r.height*dpr; const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth = 2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle = '#0B1730';
  SIG = {drawn:false, ctx, cv}; let down = false;
  const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  cv.addEventListener('pointerdown', e=>{ down = true; cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); });
  cv.addEventListener('pointermove', e=>{ if(!down) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); SIG.drawn = true; });
  const up = ()=>{ down = false; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
}

function weekData(){
  const ws = weekStart(TODAY); const out = [];
  for(let i=0;i<7;i++){
    const d = addDays(ws,i), dd = dayDiff(d,TODAY);
    const sold = dd<=0 ? sum(PAYMENTS.filter(p=>sameDay(p.date,d) && inSede(p)),p=>p.amount) : 0;
    const fut = dd>=0 ? sum((APPT_IDX[dkey(d)]||[]).filter(a=>docVisible(a.doc) && !['completada','noasistio'].includes(a.status)), a=>payAmount(a.s)) : 0;
    out.push({d, dd, sold, fut, label: cap(fmt(d,{weekday:'short'}).replace(/\./g,''))});
  }
  return out;
}

  'toast-rx': ()=>toast('Receta reenviada por WhatsApp.'),
  'consent-send': el=>toast(`Enviamos el consentimiento de ${esc(el.dataset.c.toLowerCase())} al WhatsApp de ${firstName(+el.dataset.pat)} para que lo firme.`),
  'consent-sign': el=>signModal(+el.dataset.pat, el.dataset.c),
  'sig-clear': ()=>{ if(SIG.ctx){ SIG.ctx.clearRect(0,0,SIG.cv.width,SIG.cv.height); SIG.drawn=false; } },
  'sig-save': el=>{ if(!SIG.drawn){ toast('Pide al paciente que firme en el recuadro.'); return; } const p = PAT[+el.dataset.pat]; ensurePatDocs(p); p.consents[el.dataset.c] = {date:TODAY, by:p.name}; closeModal(); render(); toast('Consentimiento firmado y guardado en el expediente.'); },
  'agenda-mode': el=>{ state.agendaMode = val(el); render(); },
  'tn-open': el=>{ const g = el.dataset.g; state.tnOpen = state.tnOpen===g ? null : g; renderTopNav(); },
  'me-menu': ()=>{ $('#me-pop').classList.toggle('open'); },
  'panel-close': ()=>closePanel(),
  'pat-quick': el=>patQuick(+el.dataset.id),
  'pv-open': el=>{ closePanel(); location.hash = el.getAttribute('href').slice(1); },
  'pv-add': el=>{ const t = $('#pv-note').value.trim(); if(!t){ toast('Escribe la nota primero.'); return; } const p = PAT[+el.dataset.id]; p.notes.unshift({date:TODAY, by:meName(), text:t}); patQuick(p.id); toast('Nota agregada al expediente.'); },
  'pv-wa': el=>{ const id = +el.dataset.id; closePanel(); state.patTab='chat'; location.hash = 'paciente-'+id; },
  'toast-call': el=>toast(`Llamando a ${firstName(+el.dataset.id)} desde el teléfono de la clínica.`),
  'pres-filter': el=>{ state.presFilter = val(el); render(); },
  'toast-dl': ()=>toast('Descarga lista.')
};

/* ================= EVENTOS ================= */
document.addEventListener('click', e=>{
  const ov = e.target.classList && e.target.classList.contains('overlay');
  if(ov){ closeModal(); return; }
  const n = $('#notif'); if(n.classList.contains('open') && !e.target.closest('#notif') && !e.target.closest('[data-action="notif"]')) n.classList.remove('open');
  const g = $('#gresults'); if(g.classList.contains('open') && !e.target.closest('.search')) g.classList.remove('open');
  const cp = $('#create-pop'); if(cp.classList.contains('open') && !e.target.closest('[data-action="create-menu"]') && !e.target.closest('#create-pop')) cp.classList.remove('open');
  if(state.tnOpen && !e.target.closest('.tn')){ state.tnOpen = null; renderTopNav(); }
  const mp = $('#me-pop'); if(mp.classList.contains('open') && !e.target.closest('.me-btn') && !e.target.closest('#me-pop')) mp.classList.remove('open');
  if(e.target.classList && e.target.classList.contains('panel-wrap')){ closePanel(); return; }
  if(e.target.closest('#create-pop button')) cp.classList.remove('open');
  const el = e.target.closest('[data-action]'); if(!el) return;
  const fn = ACTIONS[el.dataset.action]; if(!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('input', e=>{
  const el = e.target; const k = el.dataset && el.dataset.input;
  if(k==='pat-q'){ state.patQuery = el.value; state.patLimit = 30; $('#pat-table').innerHTML = patTable(); }
  if(k==='fac-q'){ state.facQuery = el.value; state.facLimit = 40; $('#fac-table').innerHTML = facTable(); }
  if(k==='ch-amt'){ CHARGE.amount = +el.value||0; const b=$('#ch-go'); if(b && !b.disabled) b.innerHTML = ic('check',17)+'Cobrar '+Q(CHARGE.amount); }
  if(k==='cc-count'){ const d = (+el.value||0) - (+el.dataset.exp); $('#cc-diff').innerHTML = d===0 ? pill('Cuadra exacto','p-brand') : d>0 ? pill('Sobran '+Q(d),'p-amber') : pill('Faltan '+Q(-d),'p-red'); }
  if(k==='gsearch') searchResults(el.value);
  if(k==='conv-q'){ state.convQ = el.value; const l = convList(); $('#conv-grid').innerHTML = l.length ? l.map(convCard).join('') : '<div class="card glass empty" style="grid-column:1/-1"><div class="h3">Sin resultados</div><p>Busca por nombre o número.</p></div>'; scrollThreads(); }
  if(k==='conv-draft'){ state.convDraft[el.dataset.id] = el.value; autoGrow(el); }
});
document.addEventListener('change', e=>{
  const el = e.target; const k = el.dataset && el.dataset.change;
  if(k==='sede'){ state.sede = el.value; render(); }
  if(k==='role') setRole(el.value);
  if(k==='pd-pat'){ DRAFT.pat = +el.value; }
  if(k==='pd-disc'){ captureDraft(); DRAFT.disc = +el.value; renderDraft(false); }
  if(k==='pd-cuo'){ captureDraft(); DRAFT.cuotas = +el.value; renderDraft(false); }
  if(k==='ch-pat'){ captureCharge(); CHARGE.pat = +el.value; renderCharge(false); }
  if(k==='conv-stage'){ const c = CONVS.find(x=>x.id===+el.dataset.id); c.stage = el.value; if(state.autoRoute) c.assignee = ROUTING[c.stage]; render(); toast(`Movida a ${STAGE[c.stage]}${state.autoRoute?' y asignada a '+TEAMM[c.assignee].name:''}.`); }
  if(k==='conv-assign'){ const c = CONVS.find(x=>x.id===+el.dataset.id); c.assignee = el.value || null; render(); toast(c.assignee ? `Asignada a ${TEAMM[c.assignee].name}. Le llega aviso.` : 'Conversación sin asignar.'); }
  if(k==='rule-set'){ ROUTING[el.dataset.stage] = el.value; CONVS.filter(c=>c.stage===el.dataset.stage).forEach(c=>c.assignee = el.value); }
  if(k==='task-who'){ state.taskWho = el.value; render(); }
});
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')){ e.preventDefault(); const s = $('#gsearch'); if(s){ s.focus(); s.select(); } }
  if(e.key==='Escape'){ $('#create-pop').classList.remove('open'); closePanel(); if(state.tnOpen){ state.tnOpen=null; renderTopNav(); } $('#me-pop').classList.remove('open'); $('#create-pop').classList.remove('open'); closeModal(); closeDrawer(); $('#notif').classList.remove('open'); $('#gresults').classList.remove('open'); }
  if(e.key==='Enter' && e.target.id==='chat-in'){ e.preventDefault(); ask(e.target.value); }
  if(e.key==='Enter' && e.target.id==='gsearch'){ const a = $('#gresults a'); if(a){ e.preventDefault(); a.click(); } }
});
window.addEventListener('resize', ()=>applyLayout());
function autoGrow(t){ t.style.height='auto'; t.style.height = Math.min(140, t.scrollHeight)+'px'; }
window.addEventListener('hashchange', ()=>{ parseHash(); state.tnOpen = null; $('#me-pop').classList.remove('open'); closePanel(); closeDrawer(); closeModal(); render(); window.scrollTo(0,0); });

/* ================= INICIO ================= */
(function init(){
  $('#brand-mark').innerHTML = logoMark(19, true); $('#brand-mark-2').innerHTML = logoMark(19, true); $('#create-m').innerHTML = ic('plus',18);
  $('#search-ic').innerHTML = ic('search',17);
  $('#menu-btn').innerHTML = ic('menu',19);
  $('#bell-btn').insertAdjacentHTML('afterbegin', ic('bell',18));
  let t = 'dark'; try{ t = localStorage.getItem('lumina-theme-v4') || 'dark'; }catch(e){}
  state.theme = t; document.documentElement.setAttribute('data-theme', t);
  parseHash(); render();
})();

})();
</script>
</body>
</html>
